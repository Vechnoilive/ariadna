name: Ariadna checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify schema export
        run: python scripts/check_schemas.py
      - name: Verify scenario declarations
        run: python scripts/check_scenarios.py
      - name: Unit HTTP and two process checks
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q hackroi scripts tests interop

  viewer:
    name: Offline viewer and delivery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-audit shipped evidence and presentation data
        run: python scripts/check_delivery.py
      - name: Audit satellite pair and measured replay
        run: python scripts/check_cosmic.py
      - name: Install browser test tool
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify JavaScript and offline browser flow
        run: |
          node --check viewer/data-loader.js
          node --check viewer/app.js
          node --check viewer/branch-map.js
          node --check viewer/map.js
          node --check viewer/tour.js
          node --check viewer/editor.js
          node --check viewer/home.js
          node --check scripts/check_studio.mjs
          node --check scripts/record_demo.mjs
          node --check scripts/build_presentation.mjs
          node scripts/check_viewer.mjs
      - name: Verify editor and real mission end to end
        env:
          ARIADNA_UI_OUTPUT: artifacts/ui
        run: node scripts/check_studio.mjs
      - name: Encode current screencast
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          fi
          python scripts/finish_recording.py --input artifacts/ui --output artifacts/current_media
      - name: Save browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariadna-3d-browser-proof
          path: |
            artifacts/ui
            artifacts/current_media
          if-no-files-found: ignore
      - name: Verify current documents and mission evidence
        run: python scripts/check_documents.py
      - name: Build and verify closed handoff package
        run: |
          python scripts/build_release.py --output artifacts/ariadna.zip --media submission --evidence submission/evidence.zip --manifest artifacts/generated-MANIFEST.json
          python scripts/verify_release.py artifacts/ariadna.zip
          cmp MANIFEST.json artifacts/generated-MANIFEST.json
          python scripts/verify_release.py --manifest MANIFEST.json
